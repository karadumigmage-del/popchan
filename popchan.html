<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POP โอ๊ยย~</title>
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#222;--accent:#2a6df4;--mut:#777;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--card:#20242c;--ink:#f1f1f1;--mut:#9aa}}
:root[data-theme="dark"]{--bg:#15171c;--card:#20242c;--ink:#f1f1f1;--mut:#9aa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Prompt","Sarabun",system-ui,sans-serif;text-align:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{margin:14px 0 0;font-size:20px;color:var(--accent)}
#count{font-size:64px;font-weight:800;line-height:1.1;margin:4px 0}
#stage{position:relative;width:min(70vw,300px);margin:6px auto 0;cursor:pointer}
#pic,#pic2{width:100%;display:block;border-radius:24px;transition:transform .06s;box-shadow:0 8px 24px #0003}
#pic2{position:absolute;inset:0;visibility:hidden}
#stage.down #pic2{visibility:visible}
#stage.down #pic{visibility:hidden}
#stage.down img{transform:scale(.95) rotate(-2deg)}
.say{position:absolute;left:50%;top:18%;font-weight:800;font-size:30px;color:#e5322d;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;white-space:nowrap;animation:fly .7s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translate(-50%,0) scale(.8)}to{opacity:0;transform:translate(-50%,-90px) scale(1.3) rotate(var(--r))}}
.hint{color:var(--mut);font-size:13px;margin:10px 0}
.box{background:var(--card);border-radius:16px;margin:12px auto;max-width:420px;padding:12px 14px;text-align:left;box-shadow:0 2px 10px #0001}
.box h2{margin:0 0 8px;font-size:16px}
#me{display:flex;gap:8px}
#nick{flex:1;min-width:0;padding:8px 10px;border-radius:10px;border:1px solid #8886;background:transparent;color:var(--ink);font:inherit}
button{font:inherit;border:0;border-radius:10px;background:var(--accent);color:#fff;padding:8px 12px}
ol{margin:0;padding:0;list-style:none}
li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #8883}
li:last-child{border:0}
li .n{width:28px;font-weight:700}li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}li .c{font-variant-numeric:tabular-nums;font-weight:700}
li.you{color:var(--accent);font-weight:700}
#note{color:var(--mut);font-size:12px;margin-top:6px}
</style></head><body>

<div class="box"><h2>ชื่อของคุณ</h2><div id="me"><input id="nick" maxlength="16" placeholder="ใส่ชื่อเล่น"><button id="save">บันทึก</button></div></div>
<div class="box"><h2>🏆 อันดับ Top 10</h2><ol id="top"></ol><div id="note"></div></div>
<script>
const $=id=>document.getElementById(id);
let count=0,nick="",dirty=false,uid=null,coll=null,writing=false;
try{count=+localStorage.getItem("pop_c")||0;nick=localStorage.getItem("pop_n")||""}catch(e){}
$("nick").value=nick;$("count").textContent=count.toLocaleString("th-TH");
const words=["โอ๊ยย~","โอ๊ยย~","โอ๊ย!","โอ๊ยยย~~","เจ็บนะ~"];
const stage=$("stage");let cx=null;
function ac(){try{cx=cx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}return cx}
function pop(){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(520,c.currentTime);o.frequency.exponentialRampToValueAtTime(180,c.currentTime+.09);g.gain.setValueAtTime(.25,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.1);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.1)}
function hit(){
  count++;dirty=true;$("count").textContent=count.toLocaleString("th-TH");
  stage.classList.add("down");pop();
  const s=document.createElement("div");s.className="say";s.textContent=words[Math.floor(Math.random()*words.length)];
  s.style.setProperty("--r",(Math.random()*30-15)+"deg");s.style.marginLeft=(Math.random()*80-40)+"px";
  stage.appendChild(s);setTimeout(()=>s.remove(),700);
  try{localStorage.setItem("pop_c",count)}catch(e){}
}
function up(){stage.classList.remove("down")}
stage.addEventListener("pointerdown",e=>{e.preventDefault();hit()});
addEventListener("pointerup",up);addEventListener("pointercancel",up);
addEventListener("keydown",e=>{if(e.code==="Space"&&!e.repeat&&document.activeElement!==$("nick")){e.preventDefault();hit();}});
addEventListener("keyup",e=>{if(e.code==="Space")up()});
$("save").onclick=()=>{nick=$("nick").value.trim().slice(0,16);try{localStorage.setItem("pop_n",nick)}catch(e){}dirty=true};
function render(rows){
  const ol=$("top");ol.textContent="";
  rows.forEach((r,i)=>{const li=document.createElement("li");if(r.id===uid)li.className="you";
    const a=document.createElement("span");a.className="n";a.textContent=i+1===1?"🥇":i+1===2?"🥈":i+1===3?"🥉":i+1;
    const b=document.createElement("span");b.className="nm";b.textContent=r.name||"นิรนาม";
    const c=document.createElement("span");c.className="c";c.textContent=(r.count||0).toLocaleString("th-TH");
    li.append(a,b,c);ol.appendChild(li)});
  if(!rows.length)$("note").textContent="ยังไม่มีใครในอันดับ ลองกดเป็นคนแรก!";
}
function local(){render(count?[{id:"me",name:nick||"คุณ",count}]:[]);$("note").textContent="แสดงเฉพาะคะแนนของคุณ (อันดับรวมต้องล็อกอินใช้งานผ่าน Claude)"}
local();
setInterval(async()=>{
  if(!dirty||writing){return}
  if(!coll){local();return}
  writing=true;dirty=false;
  try{await coll.doc(uid).set({name:nick||"นิรนาม",count})}catch(e){dirty=true;$("note").textContent="บันทึกคะแนนไม่ได้ (อาจไม่มีสิทธิ์เขียน)"}
  writing=false;
},2000);
(async()=>{
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user){return}
    uid=await user.id();coll=db.collection("scores");dirty=true;
    const t=setTimeout(()=>{$("note").textContent="โหลดอันดับช้า... แสดงคะแนนของคุณก่อน"},10000);
    coll.orderBy("count","desc").limit(10).onSnapshot(s=>{clearTimeout(t);$("note").textContent="";render(s.docs.map(d=>({id:d.id,...d.data()})))},()=>{clearTimeout(t);local()});
  }catch(e){}
})();
</script></body></html>
